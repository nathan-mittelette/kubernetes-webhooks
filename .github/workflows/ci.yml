name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docker-proxy-webhook

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.4'
        cache-dependency-path: docker-proxy-webhook/go.sum

    - name: Download dependencies
      run: go mod download

    - name: Check format
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          echo "Please run 'gofmt -s -w .' to format your code."
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Shellcheck hack/generate-certs.sh
      run: shellcheck hack/generate-certs.sh

    - name: Dry-run hack/generate-certs.sh (no cluster needed)
      run: |
        out="$(./hack/generate-certs.sh --dry-run)"
        echo "$out"
        echo "$out" | grep -q "DNS:docker-proxy-webhook.docker-proxy.svc" || { echo "missing expected SAN"; exit 1; }
        echo "$out" | grep -q ": OK" || { echo "CA did not verify the server certificate"; exit 1; }

    - name: Set up envtest (kube-apiserver, etcd for controllers/ integration tests)
      run: |
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
        echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.33.0 -p path)" >> "$GITHUB_ENV"

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Build
      run: go build -v ./...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image (verification only)
      uses: docker/build-push-action@v7
      with:
        context: ./docker-proxy-webhook
        file: ./docker-proxy-webhook/Dockerfile
        push: false
        platforms: linux/amd64,linux/arm64
        tags: docker-proxy-webhook:ci-test
        cache-from: type=gha
        cache-to: type=gha,mode=max
