apiVersion: v1
kind: Namespace
metadata:
  labels:
    docker-proxy-webhook: disabled
  name: docker-proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-proxy-config
  namespace: docker-proxy
data:
  docker-proxy-config.yaml: |
    ignoreList:
    - "123456789012.dkr.ecr.us-east-1.amazonaws.com"
    domainMap:
      # Multi-host layout: one proxy hostname per upstream registry.
      docker.io: org-name-docker-io.jfrog.io
      quay.io: org-name-quay-io.jfrog.io
      gcr.io: org-name-gcr-io.jfrog.io
      k8s.gcr.io: org-name-k8s-gcr-io.jfrog.io
      us.gcr.io: org-name-us-gcr-io.jfrog.io
      # Single-host, multi-repo layout: same proxy hostname, distinct path
      # prefix per upstream (typical Artifactory/Nexus/Harbor setup).
      docker.elastic.co: org-name.jfrog.io/docker-elastic-co-remote
      # Object form: per-domain pull secret, attached only when this mapping
      # rewrote at least one container image.
      ghcr.io:
        target: org-name-ghcr-io.jfrog.io
        pullSecrets:
        - ghcr-proxy-credentials
    # Global pull secret(s): appended whenever ANY image was rewritten.
    pullSecrets:
    - docker-proxy-credentials

    # Automatic replication of the secrets above into every namespace this
    # webhook operates in. Opt-in (default false); requires the RBAC in
    # manifests/secret-replication-rbac.yaml and POD_NAMESPACE (below).
    # secretReplication:
    #   enabled: true

    # Registry domain whitelist enforcement (validated post-rewrite). Opt-in
    # (default false/absent = always allow, same as today). domainMap values
    # and ignoreList entries above are auto-allowed; see
    # "Image Domain Validation" in the README for the full reference.
    # validation:
    #   enabled: true
    #   mode: enforce   # or "warn" for a dry-run rollout
    #   allowedDomains:
    #   - "registry.internal.example.com"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docker-proxy-webhook
  namespace: docker-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: docker-proxy-webhook
  name: docker-proxy-webhook
  namespace: docker-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-proxy-webhook
  template:
    metadata:
      labels:
        app: docker-proxy-webhook
    spec:
      affinity:
        podAntiAffinity:
          # do not schedule on the same node to avoid `hostNetwork` port conflicts
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                  - docker-proxy-webhook
      serviceAccountName: docker-proxy-webhook
      containers:
        - name: docker-proxy-webhook
          args:
            - -metrics-addr=:18080
            - -health-addr=:18081
            - -listen-port=19443
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/registry/docker-proxy
          imagePullPolicy: Always
          env:
            # Required only when secretReplication.enabled is true (identifies
            # the source namespace to replicate secrets from).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          # Graceful shutdown hack - sleep 15 seconds to give the k8s network
          # config time to update and stop routing new requests to this pod.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
          ports:
            - containerPort: 19443
              protocol: TCP
              name: https
            - containerPort: 18080
              protocol: TCP
              name: metrics
            - containerPort: 18081
              protocol: TCP
              name: monitoring
#          resources:
#            requests:
#              memory: $REQUESTS_MEMORY
#              cpu: $REQUESTS_CPU
#            limits:
#              memory: $LIMITS_MEMORY
#              cpu: $LIMITS_CPU
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: monitoring
            successThreshold: 1
            failureThreshold: 2
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
            - mountPath: /tmp/config
              name: docker-proxy-config
              readOnly: true
      hostNetwork: true
      #hostPort: 19443  // does this work in EKS now?
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: docker-proxy-webhook-certificate
        - name: docker-proxy-config
          configMap:
            name: docker-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: docker-proxy-webhook
  name: docker-proxy-webhook
  namespace: docker-proxy
spec:
  ports:
    - name: https
      port: 443  # must use 443 with our setup: https://github.com/kubernetes/kubernetes/issues/94889
      protocol: TCP
      targetPort: https
    - name: metrics
      port: 8080
      protocol: TCP
      targetPort: metrics
    - name: monitoring
      port: 8081
      protocol: TCP
      targetPort: monitoring
  selector:
    app: docker-proxy-webhook
  type: ClusterIP
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: docker-proxy-webhook
  annotations:
    cert-manager.io/inject-ca-from: docker-proxy/docker-proxy-webhook-certificate
webhooks:
  - name: docker-proxy-webhook.nexttrucking.com
    namespaceSelector:
      matchExpressions:
        - key: docker-proxy-webhook
          operator: NotIn
          values:
            - disabled
    rules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE"]
        resources:   ["pods"]
        scope:       "*"
    clientConfig:
      service:
        namespace: docker-proxy
        name: docker-proxy-webhook
        path: /mutate
        port: 443
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    matchPolicy: Equivalent
    reinvocationPolicy: IfNeeded
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: docker-proxy-webhook
  annotations:
    cert-manager.io/inject-ca-from: docker-proxy/docker-proxy-webhook-certificate
webhooks:
  - name: validate.docker-proxy-webhook.nexttrucking.com
    namespaceSelector:
      matchExpressions:
        - key: docker-proxy-webhook
          operator: NotIn
          values:
            - disabled
    rules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]   # UPDATE covers pods/ephemeralcontainers
        resources:   ["pods", "pods/ephemeralcontainers"]
        scope:       "*"
    clientConfig:
      service:
        namespace: docker-proxy
        name: docker-proxy-webhook
        path: /validate
        port: 443
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    # A security control that fails open is not a control: this blocks pod
    # creation in non-excluded namespaces if the webhook is unreachable. See
    # "Image Domain Validation" > "Failure policy trade-off" in the README
    # for mitigations (namespace opt-out, anti-affinity) and how to switch
    # this to `Ignore` for clusters that prefer availability.
    failurePolicy: Fail
    timeoutSeconds: 5
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: docker-proxy-webhook
  name: docker-proxy-webhook
  namespace: docker-proxy
spec:
  endpoints:
  - port: metrics
  selector:
    matchLabels:
      app: docker-proxy-webhook
  namespaceSelector:
    matchNames:
    - docker-proxy