# RBAC for the optional automatic pull secret replication controller
# (secretReplication.enabled: true in docker-proxy-config.yaml).
#
# Apply this file ONLY if you enable secretReplication. It is intentionally
# kept separate from manifests/k8s.yaml so that users who do not opt into
# this feature never grant the ClusterRole below: with secretReplication
# disabled, the controller is not registered at all and this file grants
# nothing that is ever used.
#
# Security note: this grants cluster-wide read/write on Secrets. Mitigations:
#   - the controller's informer cache only holds full Secret objects in the
#     source namespace; everywhere else it is restricted to secrets carrying
#     the "app.kubernetes.io/managed-by: docker-proxy-webhook" label (see
#     main.go's secretReplicationCacheOptions and the README's Security
#     section for "Automatic pull secret replication");
#   - "delete" is only ever issued by the controller against secrets matching
#     that same label — a same-named secret without it is never touched.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: docker-proxy-webhook-secret-replicator
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: docker-proxy-webhook-secret-replicator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: docker-proxy-webhook-secret-replicator
subjects:
  - kind: ServiceAccount
    name: docker-proxy-webhook
    namespace: docker-proxy
